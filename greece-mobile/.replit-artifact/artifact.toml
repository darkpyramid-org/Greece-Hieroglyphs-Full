kind = "mobile"
previewPath = "/greece-mobile/"
title = "OHANNA Mobile"
version = "1.0.0"
id = "artifacts/greece-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/greece-mobile/" ]
localPort = 20706

[services.development]
run = "npm run dev"

[services.production]
build = [ "npm", "run", "build" ]
run = [ "npm", "run", "serve" ]

[services.env]
PORT = "20706"
BASE_PATH = "/greece-mobile/"
